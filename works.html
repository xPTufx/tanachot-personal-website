<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Works | Tanachot Jekchatree</title>

    <!-- Applies the saved theme before the page is drawn (prevents a white flash in dark mode) -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                if (saved === "dark" || saved === "light") {
                    document.documentElement.setAttribute("data-theme", saved);
                } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (error) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body class="page-works">

    <!-- Top bar -->

        <nav class="topbar-inner" aria-label="Top bar">
            <a href="main.html" class="topbar-link">Home</a>
            <a href="works.html" class="topbar-link active">My Works</a>
            <button id="theme-btn" class="pill-btn topbar-theme" aria-label="Toggle theme">Dark Mode</button>
        </nav>
    </header>

    <main class="coming-soon">

    <!-- Footer: same as the main website -->

        </div>
    </footer>

    <script src="shared.js"></script>
</body>
</html>
