<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects by Tanachot Jekchatree: data analysis, statistics, and machine learning work.">
    <title>My Works | Tanachot Jekchatree</title>

    <!-- Applies the saved theme before the page is drawn (prevents a white flash in dark mode) -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("theme");
                if (saved === "dark" || saved === "light") {
                    document.documentElement.setAttribute("data-theme", saved);
                } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (error) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-works">

    <!-- Top bar -->
    <header class="topbar">
        <nav class="topbar-inner" aria-label="Top bar">
            <a href="index.html" class="topbar-link">Home</a>
            <a href="works.html" class="topbar-link active">My Works</a>
            <button id="theme-btn" class="pill-btn topbar-theme" aria-label="Toggle theme">Dark Mode</button>
        </nav>
    </header>

    <main class="works-main">
        <!-- Page heading -->
        <div class="works-header">
            <h1 class="works-title">My Works</h1>
            <p class="works-intro">
                Projects I have built to practice data analysis and machine learning.
            </p>
        </div>

        <!-- Filter buttons (built by JavaScript from the categories in the projects array) -->
        <div id="filter-bar" class="filter-bar" hidden></div>

        <!-- Project cards (built by JavaScript from the projects array in shared.js) -->
        <div id="project-list" class="project-grid"></div>

        <!-- Shown only when the projects array is empty -->
        <div id="works-empty" class="works-empty" hidden>
            <p class="coming-label">My Works</p>
            <p class="coming-title">To Be Continue</p>
            <p class="coming-sub">Projects are on the way. Check back soon.</p>
            <a href="index.html" class="coming-btn">Back to Home</a>
        </div>
    </main>

    <!-- Footer: same as the main website -->
    <footer class="footer">
        <div class="footer-inner">
            <p class="copyright">&copy; <span id="year"></span> Tanachot. All rights reserved.</p>
            <div id="footer-contacts" class="footer-contacts"></div>
        </div>
    </footer>

    <script src="shared.js"></script>
</body>
</html>
